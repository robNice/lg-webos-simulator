# Simulator configuration for the Docker container. SIMULATOR – not a real LG TV.
# On first start the image copies this template to /config/simulator.toml (mapped directory); the copy is
# yours to edit and is never overwritten. Restart the container after changes. Delete the file to get a
# fresh copy of the current template.

[server]
# Inside the container: keep 0.0.0.0, otherwise Docker cannot reach the simulator (refused at start).
# Choose the host side in docker-compose ("127.0.0.1:2222:2222"), not here.
ssh_host = "0.0.0.0"
ssh_port = 2222
admin_host = "0.0.0.0"
admin_port = 8767                     # never 8765/8766 (reserved for the Channel Editor)

[authentication]
username = "root"                     # simulated SSH user name only, no container privileges
password_env = "LG_TV_SIM_PASSWORD"   # simulator password, never the TV password; else generated
host_key_file = ".simulator/keys/ssh_host_key"
admin_token_env = "LG_TV_SIM_ADMIN_TOKEN"

[storage]
# Relative to /app; .simulator is the data volume.
base_dir = ".simulator/runs"
fixtures_dir = "fixtures/synthetic"
recorded_fixtures_dir = "fixtures/recorded"   # real TV backups, sanitised (import-fixture --public)
private_fixtures_dir = ".simulator/fixtures"
scenarios_dir = "fixtures/scenarios"
initial_fixture = "real_20261011_2301"

[behavior]
profile = "lg_webos22_historical"
read_after_write_stale_reads = 0
virtual_ms_per_call = 100
unknown_commands = "deny"
unknown_luna_methods = "deny"
seed = 1001
# optional: scenario activated at start
# scenario = "return_false_but_favorite_moved"

[device]
# Reported by getSystemInfo (editor v0.6.4 keeps backups per model + serial). The serial must start with "SIM-"
# so simulator backups never land in the real TV's backup folder.
model_name = "OLED55C27LA"
serial_number = "SIM-000000000001"

[security]
allow_external_bind = true   # deliberate: container interfaces only; publish on 127.0.0.1 on the host
allow_sftp_write = false
