# LG webOS TV Simulator – example for Docker Compose (e.g. OpenMediaVault "Compose" plugin).
# SIMULATOR – not a real LG TV. Adjust the marked lines, then: docker compose up -d
# Everything is configured here; config/simulator.toml in the config folder is optional fine-tuning.

services:
  lg-tv-sim:
    image: ghcr.io/robnice/lg-webos-simulator:latest   # or :dev for test builds, or a fixed version like :0.2.0
    container_name: lg-tv-sim
    restart: unless-stopped
    ports:
      - "2222:2222"   # SSH/SFTP for the editor (host port : container port) – change the LEFT number if taken
      - "8767:8767"   # admin UI – never 8765/8766, those belong to the Channel Editor
      # Only this host may connect? Prefix with 127.0.0.1, e.g. "127.0.0.1:2222:2222".
    volumes:
      # Runs, SSH host key (keep it, or the editor sees a new fingerprint), generated password, own fixtures:
      - /path/to/lg-webos-simulator/data:/app/.simulator      ### CHANGE THIS ###
      # Optional: simulator.toml (created on first start, never overwritten) for settings not listed below:
      - /path/to/lg-webos-simulator/config:/config            ### CHANGE THIS ###
    environment:
      TZ: Europe/Berlin
      PUID: "1000"                       # owner of the two folders on the host (id -u); never 0
      PGID: "1000"                       # (id -g)
      # Admin UI from other machines: set a password for the web page (any long string); the page asks for it
      # once per browser tab. Not the SSH password below.
      # Without it the admin UI only answers on the Docker host itself (http://127.0.0.1:8767).
      # LG_TV_SIM_ADMIN_TOKEN: "change-me-to-something-long"
      # SSH password for the editor (never the real TV password); otherwise generated, see
      #   docker compose exec lg-tv-sim cat .simulator/credentials
      # LG_TV_SIM_PASSWORD: "choose-one"
      # Optional: start state and reported TV identity (defaults: real list of 11.10.2026 23:01, OLED55C27LA)
      # LG_TV_SIM_FIXTURE: "mixed_modes"
      # LG_TV_SIM_SCENARIO: "return_false_but_favorite_moved"
      # LG_TV_SIM_MODEL: "OLED55C27LA"
      # LG_TV_SIM_SERIAL: "SIM-000000000001"     # must start with SIM-
