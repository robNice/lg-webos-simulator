[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lg-webos-tv-simulator"
dynamic = ["version"]
description = "Protocol/data-level LG webOS TV simulator for integration tests of the LG WebOS Channel Editor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "asyncssh>=2.14",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "paramiko>=2.12",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
lg-tv-sim = "lg_tv_sim.cli:main"

[tool.setuptools.dynamic]
# single source of the version: src/lg_tv_sim/__init__.py (release tags vX.Y.Z must match)
version = { attr = "lg_tv_sim.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lg_tv_sim = ["storage/schema/*.sql", "profiles/*.yaml", "admin/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "editor: end-to-end tests that drive the real local LG WebOS Channel Editor checkout",
]
filterwarnings = [
    "ignore::DeprecationWarning:paramiko.*",
    "ignore:.*TripleDES.*",
    "ignore:.*Blowfish.*",
]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "S311"]

[tool.ruff.lint.per-file-ignores]
# env-var NAMES, not secrets
"src/lg_tv_sim/config.py" = ["S105"]
# virtual TV paths inside the sandbox, never host /tmp
"src/lg_tv_sim/ssh/paths.py" = ["S108"]
"tests/**" = ["S104", "S105", "S106", "S108", "S110", "S603", "S607"]
