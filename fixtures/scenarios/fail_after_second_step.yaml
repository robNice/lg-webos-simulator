id: fail_after_second_step
description: "T33: Der 3. changeChannelNumber einer Folge schlägt fehl; Schritte 1–2 bleiben bestehen (kein Rollback)"
seed: 1001
rules:
  - id: number-3-drop
    match: {service: com.webos.service.iepg, method: changeChannelNumber, nth_call: 3}
    action: {disconnect: before}
expectations:
  - first_two_steps_applied: true
  - automatic_rollback: false
