<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LG TV Simulator</title>
<link rel="icon" type="image/png" sizes="96x96" href="/static/favicon-96x96.png?v={{version}}">
<link rel="icon" sizes="48x48" href="/favicon.ico?v={{version}}">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v={{version}}">
<meta name="theme-color" content="#020d21">
<link rel="stylesheet" href="/static/style.css?v={{version}}">
</head>
<body>
<header>
  <div class="brand"><img src="/static/logo.png?v={{version}}" alt="" width="40" height="40"><h1>LG webOS TV Simulator</h1></div>
  <div id="conn" class="muted"></div>
</header>
<main>
  <section class="cards" id="cards"></section>
  <details class="details" id="details">
    <summary>Details (Run-ID, Hashes, virtuelle Zeit)</summary>
    <div class="cards" id="detail-cards"></div>
  </details>

  <section class="panel">
    <h2>Steuerung</h2>
    <div class="controls">
      <label>Fixture <select id="fixture"></select></label>
      <label>Szenario <select id="scenario"></select></label>
      <button id="reset" class="danger">Reset auf Fixture</button>
      <button id="activate">Szenario aktivieren (mit Reset)</button>
      <button id="snapshot">Snapshot sichern</button>
      <label>Snapshot <select id="snapshots"></select></label>
      <button id="restore" class="danger">Restore</button>
      <a class="button" href="/api/export/state" id="export-state">Zustand exportieren</a>
      <a class="button" href="/api/export/trace" id="export-trace">Trace exportieren</a>
    </div>
    <p id="message" class="muted" aria-live="polite"></p>
  </section>

  <section class="panel">
    <h2>Fehlerregeln des aktiven Szenarios</h2>
    <div id="faults" class="muted"></div>
  </section>

  <section class="panel">
    <h2>Sender</h2>
    <div class="controls">
      <input id="search" type="search" placeholder="Name, Nummer oder Channel-ID">
      <select id="mode-filter"><option value="">alle Modi</option></select>
      <select id="group-filter"><option value="">alle</option></select>
      <label class="check"><input type="checkbox" id="show-sim"> sim_entry_id anzeigen</label>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nr.</th><th>Name</th><th>Modus</th><th>Channel-ID</th><th>DVB</th><th>Gruppen</th><th>LCN</th><th>Herkunft</th><th class="sim">sim_entry_id</th></tr></thead>
        <tbody id="channels"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>Ereignis-Journal</h2>
    <div class="table-wrap journal">
      <table>
        <thead><tr><th>#</th><th>virt. ms</th><th>Art</th><th>Aufruf</th><th>Antwort</th><th>Effekt / Fehlerregel</th><th>Vorher → Nachher</th></tr></thead>
        <tbody id="journal"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="/static/app.js?v={{version}}"></script>
</body>
</html>
